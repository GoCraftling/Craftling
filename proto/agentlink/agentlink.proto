syntax = "proto3";

// Package agentlink is the control-plane <-> agent control channel. The agent
// dials the control plane and holds one long-lived bidirectional stream open;
// the control plane pushes commands down it and the agent answers. This inverts
// the older model where the control plane dialed each agent's HTTP API, so
// agents need no inbound reachability.
package agentlink;

option go_package = "github.com/aarani/craftling-go/internal/agentlink/pb;agentlinkpb";

// AgentLink is served by the control plane and dialed by every agent.
service AgentLink {
  // Connect is opened once by the agent and kept open for its lifetime. The
  // agent sends a Register frame first, then Results (answers to Commands) and
  // periodic Heartbeats; the control plane streams Commands back down.
  rpc Connect(stream AgentMessage) returns (stream ControlMessage);
}

// AgentMessage is anything the agent sends up the stream.
message AgentMessage {
  oneof body {
    Register register = 1;   // first frame only
    Result result = 2;       // answer to a Command, correlated by id
    Heartbeat heartbeat = 3; // liveness, on a ticker
  }
}

// ControlMessage is anything the control plane pushes down the stream.
message ControlMessage {
  Command command = 1; // a VM lifecycle command to execute locally
}

// Register identifies the host on stream open. It mirrors the fields the old
// HTTP register carried, minus address: the control plane no longer dials the
// agent, so there is nothing to advertise.
message Register {
  string id = 1; // agent-owned stable id (keeps identity across restarts)
  string hostname = 2;
  string zone = 3;
  int32 cpus_total = 4;
  int32 memory_mb_total = 5;
  string agent_version = 6;
}

// Command is one VM lifecycle request. payload is the JSON of the existing Go
// type for the op (agent.VMSpec for provision; agent.LogsRequest for logs;
// {"vm_id":...} otherwise), so the command schema stays single-sourced in Go
// rather than duplicated here.
message Command {
  string id = 1;      // correlation id, echoed in the matching Result
  string op = 2;      // provision|start|stop|snapshot|evict|deprovision|status|logs
  bytes payload = 3;  // JSON request body for the op
}

// Result answers a Command. payload is the JSON of agent.VM when the op returns
// one (provision/start/status), the raw log bytes for logs, or empty; error is
// non-empty when the op failed.
message Result {
  string id = 1;     // matches the Command id
  bytes payload = 2; // JSON agent.VM, raw log bytes, or empty
  string error = 3;  // non-empty on failure
}

// Heartbeat proves liveness over the same stream. The stream itself is the
// primary liveness signal; this keeps the control plane's heartbeat-TTL reaper
// working as a backstop.
message Heartbeat {}
